services:
  postgres:
    image: postgres:18-alpine
    container_name: notarybuddy-postgres
    environment:
      POSTGRES_USER: notarybuddy
      POSTGRES_PASSWORD: notarybuddy
      POSTGRES_DB: notarybuddy
    ports:
      - "5432:5432"
    volumes:
      - notarybuddy-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notarybuddy -d notarybuddy"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  notarybuddy-pgdata:
